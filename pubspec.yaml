name: nikah_plan
description: "Aplikasi Pencatatan dan Manajemen Persiapan Pernikahan Modern & Elegan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.1
  # Backup & Share
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  # Notifikasi Lokal
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # Google AdMob Ads
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
